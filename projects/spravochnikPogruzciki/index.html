<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Справочник погрузчики</title>
</head>
<body>
    <div class="nav-line-profile-container">
        <div class="profile-button">Профиль</div>
    </div>

    <div class="main-container">
        <div class="panel-container">
            <div class="panel-item" sectionData="users">Пользователи</div>
            <div class="panel-item" sectionData="notifications">Уведомления <br>и напоминания</div>
            <div class="panel-item" sectionData="settings">Настройки <br>АИС ОГПА</div>
            <div class="panel-item" sectionData="loaders">Справочник погрузчиков</div>
            <div class="panel-item" sectionData="backup">Резервное копирование и восстановление</div>
            <div class="panel-item" sectionData="directory">Справочники</div>
        </div>

        <div class="directory-container" id="directory-container"></div>
    </div>
    
    <div id="downtimeModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <h2>Проблемы с погрузчиком? опишите</h2>
                <button class="modal-close-btn" onclick="closeDowntimeModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="modal-form-row">
                    <div class="modal-form-group">
                        <label for="dtStart">Начало</label>
                        <input type="datetime-local" id="dtStart">
                    </div>
                    <div class="modal-form-group">
                        <label for="dtEnd">Окончание</label>
                        <input type="datetime-local" id="dtEnd">
                    </div>
                </div>
                <div class="modal-form-group full-width">
                    <label for="dtCause">Описание инцидента</label>
                    <textarea id="dtCause" rows="4" placeholder="Введите описание проблемы..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn save-btn" onclick="saveDowntime()">Сохранить</button>
                <button class="modal-btn cancel-btn" onclick="closeDowntimeModal()">Выход</button>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
